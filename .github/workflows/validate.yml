name: Validate web and API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: node --check web/app.js

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend
      - name: Start API
        run: |
          GFN_ADMIN_TOKEN=ci-smoke-secret uvicorn app:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/health; then
              break
            fi
            sleep 1
          done
      - name: Exercise upload, moderation, selection, sync and download
        run: |
          printf 'ID3\003\000\000\000\000\000\000smoke-test-audio' > /tmp/gfn-smoke.mp3
          missing_rights_status=$(curl --silent --show-error -o /tmp/gfn-missing-rights.json -w "%{http_code}" -F "file=@/tmp/gfn-smoke.mp3;type=audio/mpeg" -F "gd_song_id=467339" -F "original_name=At The Speed Of Light" http://127.0.0.1:8000/api/v1/nongs/upload)
          test "$missing_rights_status" = "422"
          test "$(find backend/data/audio -type f | wc -l)" -eq 0
          upload=$(curl --fail --silent --show-error -F "file=@/tmp/gfn-smoke.mp3;type=audio/mpeg" -F "gd_song_id=467339" -F "original_name=At The Speed Of Light" -F "rights_confirmed=true" -F "custom_name=CI Smoke Remix" http://127.0.0.1:8000/api/v1/nongs/upload)
          nong_id=$(python -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$upload")
          duplicate_status=$(curl --silent --show-error -o /tmp/gfn-duplicate.json -w "%{http_code}" -F "file=@/tmp/gfn-smoke.mp3;type=audio/mpeg" -F "gd_song_id=467339" -F "original_name=At The Speed Of Light" -F "rights_confirmed=true" http://127.0.0.1:8000/api/v1/nongs/upload)
          test "$duplicate_status" = "409"
          test "$(find backend/data/audio -type f | wc -l)" -eq 1
          curl --fail --silent --show-error -X POST -H "X-Admin-Token: ci-smoke-secret" -H "Content-Type: application/json" -d '{"decision":"approve"}' "http://127.0.0.1:8000/api/v1/admin/nongs/$nong_id/moderate"
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" -d "{\"gd_song_id\":\"467339\",\"nong_id\":$nong_id,\"device_id\":\"ci-smoke-device\"}" http://127.0.0.1:8000/api/v1/selections/save
          catalog=$(curl --fail --silent --show-error "http://127.0.0.1:8000/api/v1/catalog/songs?q=At%20The%20Speed%20Of%20Light&page=1&limit=1")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["pagination"]["total"] == 1; assert len(d["items"]) == 1; assert d["items"][0]["gd_song_id"] == "467339"; assert d["pagination"]["pages"] == 1; print("Paginated catalogue search passed")' <<< "$catalog"
          empty=$(curl --fail --silent --show-error "http://127.0.0.1:8000/api/v1/catalog/songs?q=not-a-real-track&page=99&limit=10")
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["items"] == []; assert d["pagination"]["page"] == 1; assert d["pagination"]["pages"] == 0; assert not d["pagination"]["has_next"]; print("Empty/out-of-range catalogue handling passed")' <<< "$empty"
          curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/sync/ci-smoke-device
          curl --fail --silent --show-error -o /tmp/gfn-downloaded.mp3 "http://127.0.0.1:8000/api/v1/nongs/$nong_id/download"
          cmp /tmp/gfn-smoke.mp3 /tmp/gfn-downloaded.mp3
